[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ecc-rag"
version = "2.0.0"
description = "Egyptian Civil Code RAG — grounded, citation-validated legal Q&A with MLOps"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Code: Apache-2.0 (see LICENSE). Legal corpus: see docs/DATA_SOURCES.md" }
# Runtime dependencies of the API image. Exact versions are locked in uv.lock.
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "pyyaml>=6,<7",
    "numpy>=2,<3",
    "scikit-learn>=1.5,<2",
    "joblib>=1.4,<2",
    "rank-bm25==0.2.2",
    "qdrant-client>=1.12,<2",
    "google-genai>=1.0,<3",
    "prometheus-client>=0.20,<1",
]

[project.optional-dependencies]
# data pipeline (PDF extraction) — not needed inside the API image
pipeline = ["pymupdf==1.28.2"]
# experiment tracking + data versioning
mlops = ["mlflow>=2.16,<4", "dvc>=3.50,<4"]
# self-hosted neural embeddings / cross-encoder (optional, large: pulls torch)
neural = ["sentence-transformers>=3,<6"]
# LLM-based RAG evaluation (needs an LLM API key at run time). Import compatibility of this exact set was
# verified on 2026-10-17 (ragas 0.3.9 breaks with langchain-community>=0.4); metrics were NOT executed offline.
ragas = ["ragas==0.3.9", "langchain-community>=0.3,<0.4", "langchain-google-genai>=3,<4"]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "httpx>=0.27,<1",
    "ruff>=0.6,<1",
    "mypy>=1.11,<3",
    "types-PyYAML",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: needs the real corpus + index built by `make data index` (data/processed, data/index)",
    "e2e: end-to-end through the HTTP API on the real corpus",
    "llm: calls a real LLM provider (needs GEMINI_API_KEY); skipped otherwise",
    "perf: performance/load tests",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["src/ecc_rag"]
omit = ["src/ecc_rag/rag/embeddings.py:*SentenceTransformer*"]

[tool.ruff]
line-length = 140
target-version = "py311"
extend-exclude = ["baselines/reference_pipeline"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "RUF", "BLE"]
ignore = ["RUF001", "RUF002", "RUF003", "S101", "S311", "B008", "S603", "S607", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]
"scripts/**" = ["S"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
files = ["src/ecc_rag"]
