- {id: q117, question: "هل يجوز للمحامي أن يشتري الحق المتنازع فيه الذي يدافع عنه؟", style: msa, type: exception, difficulty: medium, expected_behavior: answer, expected_articles: [471, 472], acceptable_articles: [], key_points: ["لا يجوز للقضاة ولا لأعضاء النيابة ولا للمحامين ولا لكتبة المحاكم ولا للمحضرين أن يشتروا الحق المتنازع فيه إذا كان النظر في النزاع يدخل في اختصاص المحكمة التي يباشرون أعمالهم في دائرتها وإلا كان البيع باطلاً", "لا يجوز للمحامين أن يتعاملوا مع موكليهم في الحقوق المتنازع فيها إذا كانوا هم الذين يتولون الدفاع عنها"]}
- {id: q118, question: "ما هي المقايضة؟", style: msa, type: direct, difficulty: easy, expected_behavior: answer, expected_articles: [482], acceptable_articles: [485], key_points: ["عقد يلتزم به كل من المتعاقدين أن ينقل إلى الآخر على سبيل التبادل ملكية مال ليس من النقود"]}
# ---------------------------------------------------------------- gift, partnership, loan, compromise
- {id: q119, question: "ما الشكل المطلوب لصحة الهبة؟", style: msa, type: exception, difficulty: medium, expected_behavior: answer, expected_articles: [488], acceptable_articles: [490], key_points: ["تكون الهبة بورقة رسمية وإلا وقعت باطلة ما لم تتم تحت ستار عقد آخر", "يجوز في المنقول أن تتم الهبة بالقبض دون حاجة إلى ورقة رسمية"]}
- {id: q120, question: "إديت أخويا هدية شقة وبعدين اتخانق معايا وأهانّي جامد، ينفع أرجع في الهبة؟", style: egyptian, type: scenario, difficulty: hard, expected_behavior: answer, expected_articles: [500, 501], acceptable_articles: [502, 488], key_points: ["يجوز للواهب الرجوع في الهبة إذا قبل الموهوب له، فإن لم يقبل جاز طلب الترخيص من القضاء متى كان يستند إلى عذر مقبول ولم يوجد مانع", "من الأعذار المقبولة أن يخل الموهوب له بما يجب عليه نحو الواهب إخلالاً يكون جحوداً كبيراً من جانبه", "من موانع الرجوع أن تكون الهبة لذي رحم محرم (م ٥٠٢) ويلزم بحث انطباقها"]}
- {id: q121, question: "ما هي موانع الرجوع في الهبة؟", style: msa, type: direct, difficulty: medium, expected_behavior: answer, expected_articles: [502], acceptable_articles: [500], key_points: ["الزيادة المتصلة الموجبة لزيادة القيمة", "موت أحد طرفي العقد", "تصرف الموهوب له في الشيء تصرفاً نهائياً", "الهبة بين الزوجين أو لذي رحم محرم", "هلاك الشيء", "الهبة بعوض أو صدقة أو عمل خيري"]}
- {id: q122, question: "ما تعريف عقد الشركة وهل يشترط أن يكون مكتوباً؟", style: msa, type: multi_article, difficulty: medium, expected_behavior: answer, expected_articles: [505, 507], acceptable_articles: [506], key_points: ["عقد بمقتضاه يلتزم شخصان أو أكثر بأن يساهم كل منهم في مشروع مالي بتقديم حصة من مال أو عمل لاقتسام ما قد ينشأ من ربح أو خسارة", "يجب أن يكون عقد الشركة مكتوباً وإلا كان باطلاً"]}
- {id: q123, question: "هل يجوز الاتفاق على أن أحد الشركاء لا يتحمل أي خسارة؟", style: msa, type: exception, difficulty: hard, expected_behavior: answer, expected_articles: [515], acceptable_articles: [514], key_points: ["إذا اتفق على أن أحد الشركاء لا يساهم في الأرباح أو الخسائر كان العقد باطلاً", "يجوز الاتفاق على إعفاء الشريك الذي لم يقدم غير عمله من المساهمة في الخسائر بشرط ألا يكون قد تقرر له أجر عن عمله"]}
- {id: q124, question: "متى تنتهي الشركة؟", style: msa, type: multi_article, difficulty: medium, expected_behavior: answer, expected_articles: [526, 527, 528], acceptable_articles: [529, 530], key_points: ["بانقضاء الميعاد أو انتهاء العمل", "بهلاك جميع مالها أو جزء كبير منه", "بموت أحد الشركاء أو الحجر عليه أو إعساره أو إفلاسه مع جواز الاتفاق على الاستمرار"]}
- {id: q125, question: "ما تعريف عقد القرض؟", style: msa, type: direct, difficulty: easy, expected_behavior: answer, expected_articles: [538], acceptable_articles: [542], key_points: ["عقد يلتزم به المقرض أن ينقل إلى المقترض ملكية مبلغ من النقود أو أي شيء مثلي آخر على أن يرد إليه المقترض عند نهاية القرض شيئاً مثله في مقداره ونوعه وصفته"]}
- {id: q126, question: "هل يجوز الصلح في المسائل المتعلقة بالحالة الشخصية؟", style: msa, type: exception, difficulty: medium, expected_behavior: answer, expected_articles: [551], acceptable_articles: [549], key_points: ["لا يجوز الصلح في المسائل المتعلقة بالحالة الشخصية أو بالنظام العام", "يجوز الصلح على المصالح المالية التي تترتب على الحالة الشخصية أو التي تنشأ عن ارتكاب إحدى الجرائم"]}
- {id: q127, question: "كيف يثبت عقد الصلح؟", style: msa, type: direct, difficulty: easy, expected_behavior: answer, expected_articles: [552], acceptable_articles: [], key_points: ["لا يثبت الصلح إلا بالكتابة أو بمحضر رسمي"]}
# ---------------------------------------------------------------- lease
- {id: q128, question: "ما تعريف عقد الإيجار؟", style: msa, type: direct, difficulty: easy, expected_behavior: answer, expected_articles: [558], acceptable_articles: [], key_points: ["عقد يلتزم المؤجر بمقتضاه أن يمكن المستأجر من الانتفاع بشيء معين مدة معينة لقاء أجر معلوم"]}
- {id: q129, question: "إذا لم يتفق المؤجر والمستأجر على مدة الإيجار، كم تكون مدته؟", style: msa, type: exception, difficulty: medium, expected_behavior: answer, expected_articles: [563], acceptable_articles: [], key_points: ["يعتبر الإيجار منعقداً للفترة المعينة لدفع الأجرة", "وينتهي بانقضاء هذه الفترة بناء على طلب أحد المتعاقدين إذا هو نبه على المتعاقد الآخر بالإخلاء في المواعيد المبينة بالمادة"]}
- {id: q130, question: "مين المسئول عن صيانة الشقة المؤجرة، أنا ولا صاحب الشقة؟", style: egyptian, type: scenario, difficulty: medium, expected_behavior: answer, expected_articles: [567], acceptable_articles: [582, 568], key_points: ["على المؤجر أن يتعهد العين المؤجرة بالصيانة وأن يقوم أثناء الإجارة بجميع الترميمات الضرورية دون الترميمات التأجيرية", "يلتزم المستأجر بالترميمات التأجيرية التي يقضي بها العرف ما لم يتفق على غير ذلك (م ٥٨٢)"]}
- {id: q131, question: "هل يجوز للمستأجر أن يؤجر العين من الباطن؟", style: msa, type: direct, difficulty: medium, expected_behavior: answer, expected_articles: [593], acceptable_articles: [594, 596], key_points: ["للمستأجر حق التنازل عن الإيجار أو الإيجار من الباطن عن كل ما استأجره أو بعضه ما لم يقض الاتفاق بغير ذلك"]}
- {id: q132, question: "هل ينتهي عقد الإيجار بموت المستأجر؟", style: msa, type: exception, difficulty: medium, expected_behavior: answer, expected_articles: [601], acceptable_articles: [602], key_points: ["لا ينتهي الإيجار بموت المؤجر ولا بموت المستأجر", "يجوز لورثة المستأجر طلب إنهاء العقد إذا أثبتوا أن أعباءه أصبحت أثقل من مواردهم أو مجاوزاً حاجتهم خلال ستة أشهر على الأكثر من وقت الموت"]}
- {id: q133, question: "صاحب العمارة باعها لواحد تاني، هل المالك الجديد يقدر يطلعني من الشقة؟", style: egyptian, type: scenario, difficulty: hard, expected_behavior: answer, expected_articles: [604], acceptable_articles: [605], key_points: ["إذا انتقلت ملكية العين المؤجرة لا يكون الإيجار نافذاً في حق المالك الجديد إذا لم يكن له تاريخ ثابت سابق على التصرف", "لا يجوز لمن انتقلت إليه الملكية ولم يكن الإيجار نافذاً في حقه أن يجبر المستأجر على الإخلاء إلا بعد التنبيه في المواعيد (م ٦٠٥)", "قد تسري تشريعات خاصة بإيجار الأماكن غير موجودة في هذا الـCorpus"]}
- {id: q134, question: "إذا هلكت العين المؤجرة هلاكاً كلياً أثناء الإيجار، ما مصير العقد؟", style: msa, type: direct, difficulty: medium, expected_behavior: answer, expected_articles: [569], acceptable_articles: [], key_points: ["ينفسخ العقد من تلقاء نفسه", "إذا كان الهلاك جزئياً جاز للمستأجر طلب إنقاص الأجرة أو فسخ الإيجار"]}
- {id: q135, question: "ما مسئولية المستأجر عن حريق العين المؤجرة؟", style: msa, type: exception, difficulty: medium, expected_behavior: answer, expected_articles: [584], acceptable_articles: [583], key_points: ["المستأجر مسئول عن حريق العين المؤجرة إلا إذا أثبت أن الحريق نشأ عن سبب لا يد له فيه", "إذا تعدد المستأجرون كان كل منهم مسئولاً بنسبة الجزء الذي يشغله"]}
- {id: q136, question: "Is a lease terminated by the death of the lessee?", style: english, type: exception, difficulty: medium, expected_behavior: answer, expected_articles: [601], acceptable_articles: [602], key_points: ["a lease is not terminated by the death of the lessor or the lessee", "the lessee's heirs may claim termination if the burdens became too heavy for their resources or exceed their needs"]}
# ---------------------------------------------------------------- work, employment, agency, deposit
- {id: q137, question: "ما مدة ضمان المهندس المعماري والمقاول لعيوب المباني؟", style: msa, type: direct, difficulty: medium, expected_behavior: answer, expected_articles: [651], acceptable_articles: [652, 653, 654], key_points: ["يضمن المهندس المعماري والمقاول متضامنين ما يحدث خلال عشر سنوات من تهدم كلي أو جزئي فيما شيدوه من مبان أو منشآت ثابتة ولو كان التهدم ناشئاً عن عيب في الأرض", "يشمل الضمان العيوب التي يترتب عليها تهديد متانة البناء وسلامته"]}
- {id: q138, question: "العمارة اللي اشتريت فيها شقة اتشرخت بعد ٧ سنين من بناها، المقاول مسئول؟ وأرفع القضية امتى؟", style: egyptian, type: scenario, difficulty: hard, expected_behavior: answer, expected_articles: [651, 654], acceptable_articles: [653, 177], key_points: ["ضمان عشري للمهندس والمقاول عن التهدم والعيوب التي تهدد متانة البناء", "تسقط دعاوى الضمان بانقضاء ثلاث سنوات من وقت حصول التهدم أو انكشاف العيب", "حق المشتري في الرجوع يحتاج بحث علاقته التعاقدية"]}
- {id: q139, question: "هل يجوز إعفاء المقاول من ضمان سلامة البناء بشرط في العقد؟", style: msa, type: exception, difficulty: medium, expected_behavior: answer, expected_articles: [653], acceptable_articles: [651], key_points: ["يكون باطلاً كل شرط يقصد به إعفاء المهندس المعماري والمقاول من الضمان أو الحد منه"]}
- {id: q140, question: "هل يجوز لصاحب العمل أن ينهي عقد المقاولة قبل إتمام العمل؟", style: msa, type: direct, difficulty: medium, expected_behavior: answer, expected_articles: [663], acceptable_articles: [], key_points: ["لرب العمل أن يتحلل من العقد ويقف التنفيذ في أي وقت قبل إتمامه", "على أن يعوض المقاول عن جميع ما أنفقه وما أنجزه وما كان يستطيع كسبه لو أتم العمل"]}
- {id: q141, question: "ما المقصود بشرط عدم المنافسة في عقد العمل وما شروط صحته؟", style: msa, type: multi_condition, difficulty: hard, expected_behavior: answer, expected_articles: [686], acceptable_articles: [687], key_points: ["إذا كان العمل يسمح للعامل بمعرفة عملاء رب العمل أو الاطلاع على أسرار أعماله جاز الاتفاق على ألا ينافسه بعد انتهاء العقد", "يشترط أن يكون العامل بالغاً رشده وقت العقد وأن يكون القيد مقصوراً من حيث الزمان والمكان ونوع العمل على القدر الضروري لحماية مصالح رب العمل المشروعة"]}
- {id: q142, question: "ما مدة تقادم الدعاوى الناشئة عن عقد العمل؟", style: msa, type: direct, difficulty: medium, expected_behavior: answer, expected_articles: [698], acceptable_articles: [], key_points: ["تسقط بانقضاء سنة تبدأ من وقت انتهاء العقد", "إلا فيما يتعلق بالعمالة والمشاركة في الأرباح والنسب المئوية فتبدأ من وقت تسليم الكشف"]}
- {id: q143, question: "هل تكفي الوكالة العامة لبيع عقار الموكل؟", style: msa, type: exception, difficulty: medium, expected_behavior: answer, expected_articles: [702], acceptable_articles: [701], key_points: ["لابد من وكالة خاصة في كل عمل ليس من أعمال الإدارة وبوجه خاص في البيع والرهن والتبرعات والصلح والإقرار والتحكيم", "الوكالة العامة لا تخول إلا أعمال الإدارة (م ٧٠١)"]}
- {id: q144, question: "هل يجوز للموكل عزل الوكيل في أي وقت؟", style: msa, type: direct, difficulty: medium, expected_behavior: answer, expected_articles: [715], acceptable_articles: [714, 716], key_points: ["يجوز للموكل في أي وقت أن ينهي الوكالة أو يقيدها ولو وجد اتفاق يخالف ذلك", "إذا كانت الوكالة بأجر يلتزم الموكل بتعويض الوكيل عن الضرر إذا عزله في وقت غير مناسب أو بغير عذر مقبول", "لا يجوز إنهاء الوكالة الصادرة لصالح الوكيل أو الغير دون رضاء من صدرت لصالحه"]}
- {id: q145, question: "إمتى تنتهي الوكالة؟", style: egyptian, type: direct, difficulty: easy, expected_behavior: answer, expected_articles: [714], acceptable_articles: [715, 716], key_points: ["تنتهي بإتمام العمل الموكل فيه أو بانتهاء الأجل المعين", "تنتهي أيضاً بموت الموكل أو الوكيل"]}
- {id: q146, question: "ما مسئولية أصحاب الفنادق عن أشياء النزلاء؟", style: msa, type: direct, difficulty: medium, expected_behavior: answer, expected_articles: [727], acceptable_articles: [728], key_points: ["يكون أصحاب الفنادق والخانات مسئولين حتى عن فعل المترددين على الفندق", "لا يسألون عن النقود والأشياء الثمينة بما يزيد على خمسين جنيهاً إلا إذا أخذوها في حفظهم أو رفضوها دون مسوغ أو تسببوا بخطأ جسيم"]}
- {id: q147, question: "هل يجوز استرداد ما خسرته في رهان أو قمار؟", style: msa, type: exception, difficulty: medium, expected_behavior: answer, expected_articles: [739], acceptable_articles: [740], key_points: ["يكون باطلاً كل اتفاق خاص بمقامرة أو رهان", "لمن خسر أن يسترد ما دفعه خلال ثلاث سنوات من الوقت الذي أدى فيه ما خسره ولو كان هناك اتفاق يقضي بغير ذلك"]}
# ---------------------------------------------------------------- insurance, suretyship
- {id: q148, question: "ما تعريف عقد التأمين؟", style: msa, type: direct, difficulty: easy, expected_behavior: answer, expected_articles: [747], acceptable_articles: [749], key_points: ["عقد يلتزم المؤمن بمقتضاه أن يؤدي إلى المؤمن له أو المستفيد مبلغاً من المال أو إيراداً مرتباً أو أي عوض مالي آخر في حالة وقوع الحادث أو تحقق الخطر المبين بالعقد", "وذلك في نظير قسط أو أية دفعة مالية أخرى"]}
- {id: q149, question: "ما مدة تقادم الدعاوى الناشئة عن عقد التأمين؟", style: msa, type: direct, difficulty: medium, expected_behavior: answer, expected_articles: [752], acceptable_articles: [], key_points: ["تسقط بالتقادم بانقضاء ثلاث سنوات من وقت حدوث الواقعة التي تولدت عنها", "لا تسري المدة في حالة الإخفاء أو البيانات الكاذبة إلا من يوم علم المؤمن ولا في حالة وقوع الحادث إلا من يوم علم ذوي الشأن به"]}
- {id: q150, question: "هل يجوز التأمين على حياة شخص آخر دون موافقته؟", style: msa, type: exception, difficulty: medium, expected_behavior: answer, expected_articles: [755], acceptable_articles: [], key_points: ["يقع باطلاً التأمين على حياة الغير ما لم يوافق الغير عليه كتابة قبل إبرام العقد", "إذا كان الغير لا تتوافر فيه الأهلية فلا يكون العقد صحيحاً إلا بموافقة من يمثله قانوناً"]}
- {id: q151, question: "ما هي الكفالة وكيف تثبت؟", style: msa, type: multi_article, difficulty: easy, expected_behavior: answer, expected_articles: [772, 773], acceptable_articles: [], key_points: ["عقد بمقتضاه يكفل شخص تنفيذ التزام بأن يتعهد للدائن بأن يفي بهذا الالتزام إذا لم يف به المدين نفسه", "لا تثبت الكفالة إلا بالكتابة ولو كان من الجائز إثبات الالتزام الأصلي بالبينة"]}
- {id: q152, question: "أنا ضامن لصاحبي في قرض، هل البنك يقدر يطالبني أنا الأول قبل ما يطالبه هو؟", style: egyptian, type: scenario, difficulty: hard, expected_behavior: answer, expected_articles: [788], acceptable_articles: [789, 793, 772], key_points: ["لا يجوز للدائن أن يرجع على الكفيل وحده إلا بعد رجوعه على المدين", "لا ينفذ على أموال الكفيل إلا بعد تجريد المدين ويجب على الكفيل أن يتمسك بهذا الحق", "لا يجوز للكفيل المتضامن مع المدين أن يطلب التجريد (م ٧٩٣)"]}
- {id: q153, question: "هل يجوز للكفيل المتضامن أن يطلب تجريد المدين أولاً؟", style: msa, type: exception, difficulty: medium, expected_behavior: answer, expected_articles: [793], acceptable_articles: [788, 794], key_points: ["لا يجوز للكفيل المتضامن مع المدين أن يطلب التجريد"]}
# ---------------------------------------------------------------- ownership & neighbours
- {id: q154, question: "ما هي سلطات المالك على ملكه؟", style: msa, type: direct, difficulty: easy, expected_behavior: answer, expected_articles: [802], acceptable_articles: [803, 804], key_points: ["لمالك الشيء وحده في حدود القانون حق استعماله واستغلاله والتصرف فيه"]}
- {id: q155, question: "هل يجوز نزع ملكية شخص بدون تعويض؟", style: msa, type: exception, difficulty: easy, expected_behavior: answer, expected_articles: [805], acceptable_articles: [], key_points: ["لا يجوز أن يحرم أحد من ملكه إلا في الأحوال التي يقررها القانون وبالطريقة التي يرسمها", "ويكون ذلك في مقابل تعويض عادل"]}
